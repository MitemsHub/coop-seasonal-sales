---
deployment:
  tasks:
    # Load nvm so Node.js is available in the deployment shell
    - export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

    # Use Node.js 20
    - nvm use 20

    # Install production dependencies only
    - npm install --omit=dev

    # Install PM2 locally (in case it's not in node_modules yet)
    - npm install pm2

    # Build the Next.js standalone output
    - npm run build

    # Copy static assets and public folder into standalone
    - node -e "const fs=require('fs');const path=require('path');const copy=(src,dst)=>{if(!fs.existsSync(src))return;fs.rmSync(dst,{recursive:true,force:true});fs.mkdirSync(dst,{recursive:true});fs.cpSync(src,dst,{recursive:true});};copy(path.join('.next','static'),path.join('.next','standalone','.next','static'));copy('public',path.join('.next','standalone','public'));"

    # Stop existing process if running, then start with PM2
    - npx pm2 delete coop-seasonal-sales 2>/dev/null; npx pm2 start .next/standalone/server.js --name coop-seasonal-sales
    - npx pm2 save
