<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hero photo check</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 16px; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .card { background: #1c1c1c; border-radius: 8px; overflow: hidden; }
  .card img { width: 100%; display: block; aspect-ratio: 4/3; object-fit: cover; }
  .card .name { padding: 4px 8px; font-size: 11px; color: #bbb; }
</style>
</head>
<body>
<h1>Hero photos — check for Gemini logos</h1>
<div class="grid">
  <div class="card"><img src="/landing/photos/hero-logistics.jpg"><div class="name">hero-logistics</div></div>
  <div class="card"><img src="/landing/photos/hero-ram.jpg"><div class="name">hero-ram</div></div>
  <div class="card"><img src="/landing/photos/hero-community.jpg"><div class="name">hero-community</div></div>
  <div class="card"><img src="/landing/photos/hero-04.jpg"><div class="name">hero-04</div></div>
  <div class="card"><img src="/landing/photos/hero-05.jpg"><div class="name">hero-05</div></div>
  <div class="card"><img src="/landing/photos/hero-06.jpg"><div class="name">hero-06</div></div>
  <div class="card"><img src="/landing/photos/hero-07.jpg"><div class="name">hero-07</div></div>
  <div class="card"><img src="/landing/photos/hero-08.jpg"><div class="name">hero-08</div></div>
  <div class="card"><img src="/landing/photos/hero-09.jpg"><div class="name">hero-09</div></div>
  <div class="card"><img src="/landing/photos/hero-10.jpg"><div class="name">hero-10</div></div>
  <div class="card"><img src="/landing/photos/hero-11.jpg"><div class="name">hero-11</div></div>
  <div class="card"><img src="/landing/photos/hero-12.jpg"><div class="name">hero-12</div></div>
  <div class="card"><img src="/landing/photos/hero-13.jpg"><div class="name">hero-13</div></div>
  <div class="card"><img src="/landing/photos/hero-15.jpg"><div class="name">hero-15</div></div>
</div>
</body>
</html>
