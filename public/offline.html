<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — CBN Coop</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #fafaf9;
        color: #17201b;
        text-align: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 26rem;
        background: #fff;
        border: 1px solid #e7e5e1;
        border-radius: 1rem;
        box-shadow: 0 10px 30px rgba(29, 103, 70, 0.08);
        padding: 2rem 1.75rem;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 3rem;
        height: 3rem;
        border-radius: 9999px;
        background: #dbf2e4;
        color: #1d6746;
        font-size: 1.5rem;
        margin-bottom: 1rem;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0; color: #5a645e; line-height: 1.6; font-size: 0.95rem; }
      button {
        margin-top: 1.25rem;
        border: 0;
        border-radius: 0.65rem;
        padding: 0.65rem 1.4rem;
        background: #1d6746;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f0e0c; color: #f4f4f2; }
        .card { background: #1a1917; border-color: #3b3833; }
        h1 { color: #f4f4f2; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">☀️</div>
      <h1>You're offline</h1>
      <p>
        This page needs the Coop to be reachable. Your last-loaded pages and
        balances will come back the moment you reconnect.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
